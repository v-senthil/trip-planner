name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Install & cache dependencies
  # ─────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache: npm here — we manage node_modules directories directly

      - name: Cache root node_modules
        uses: actions/cache@v4
        id: cache-root
        with:
          path: node_modules
          key: root-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: root-${{ runner.os }}-node20-

      - name: Cache server node_modules
        uses: actions/cache@v4
        id: cache-server
        with:
          path: server/node_modules
          # Node version is in the key because better-sqlite3 is a native addon
          # compiled against a specific Node ABI — stale binaries break at runtime.
          key: server-${{ runner.os }}-node20-${{ hashFiles('server/package-lock.json') }}
          restore-keys: server-${{ runner.os }}-node20-

      - name: Cache client node_modules
        uses: actions/cache@v4
        id: cache-client
        with:
          path: client/node_modules
          key: client-${{ runner.os }}-node20-${{ hashFiles('client/package-lock.json') }}
          restore-keys: client-${{ runner.os }}-node20-

      - name: Install all dependencies
        if: |
          steps.cache-root.outputs.cache-hit != 'true' ||
          steps.cache-server.outputs.cache-hit != 'true' ||
          steps.cache-client.outputs.cache-hit != 'true'
        run: npm run install:all

  # ─────────────────────────────────────────────
  # Build client
  # ─────────────────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Scope the npm cache to the client lockfile in this monorepo
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore client node_modules
        uses: actions/cache@v4
        id: cache-client
        with:
          path: client/node_modules
          key: client-${{ runner.os }}-node20-${{ hashFiles('client/package-lock.json') }}
          restore-keys: client-${{ runner.os }}-node20-

      - name: Install client dependencies (cache miss fallback)
        if: steps.cache-client.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci

      - name: Build Vite client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # Lint server (basic syntax check via node)
  # ─────────────────────────────────────────────
  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # node --check parses syntax only; it does NOT resolve imports,
      # so server/node_modules is NOT needed — cache restore removed.
      - name: Syntax check all server source files
        run: |
          find server/src -name "*.js" | while read f; do
            node --check "$f" || exit 1
          done

  # ─────────────────────────────────────────────
  # Database initialisation check (SQLite / better-sqlite3)
  # ─────────────────────────────────────────────
  test-db:
    name: Test DB Init
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore server node_modules
        uses: actions/cache@v4
        id: cache-server
        with:
          path: server/node_modules
          key: server-${{ runner.os }}-node20-${{ hashFiles('server/package-lock.json') }}
          restore-keys: server-${{ runner.os }}-node20-

      - name: Install server dependencies (cache miss fallback)
        if: steps.cache-server.outputs.cache-hit != 'true'
        working-directory: server
        run: npm ci

      - name: Create data directory
        run: mkdir -p server/data

      - name: Verify DB initialises without errors
        working-directory: server
        env:
          ENCRYPTION_SECRET: ci-test-encryption-secret-32chars!!
        run: |
          node --input-type=module <<'EOF'
          import Database from 'better-sqlite3';
          import path from 'path';
          import fs from 'fs';
          import crypto from 'crypto';

          // ── Encryption helpers (mirrors encryptionService.js) ──────────────
          const ALGORITHM = 'aes-256-gcm';
          const RAW_SECRET = process.env.ENCRYPTION_SECRET;
          const KEY = crypto.createHash('sha256').update(RAW_SECRET).digest();

          function encrypt(plain) {
            const iv = crypto.randomBytes(12);
            const c  = crypto.createCipheriv(ALGORITHM, KEY, iv, { authTagLength: 16 });
            const ct = Buffer.concat([c.update(plain, 'utf8'), c.final()]);
            return `${iv.toString('hex')}:${c.getAuthTag().toString('hex')}:${ct.toString('hex')}`;
          }
          function decrypt(stored) {
            const [ivHex, tagHex, ctHex] = stored.split(':');
            const d = crypto.createDecipheriv(ALGORITHM, KEY, Buffer.from(ivHex, 'hex'), { authTagLength: 16 });
            d.setAuthTag(Buffer.from(tagHex, 'hex'));
            return d.update(Buffer.from(ctHex, 'hex'), undefined, 'utf8') + d.final('utf8');
          }

          // ── DB setup ───────────────────────────────────────────────────────
          const DB_PATH = path.resolve('data/ci-test.db');
          fs.mkdirSync(path.dirname(DB_PATH), { recursive: true });

          const db = new Database(DB_PATH);
          db.pragma('journal_mode = WAL');
          db.pragma('foreign_keys = ON');

          db.exec(`
            CREATE TABLE IF NOT EXISTS trips (
              id          TEXT PRIMARY KEY,
              destination TEXT NOT NULL,
              created_at  TEXT DEFAULT (datetime('now')),
              updated_at  TEXT DEFAULT (datetime('now'))
            );
            CREATE TABLE IF NOT EXISTS days (
              id         INTEGER PRIMARY KEY AUTOINCREMENT,
              trip_id    TEXT NOT NULL REFERENCES trips(id) ON DELETE CASCADE,
              day_number INTEGER NOT NULL,
              UNIQUE(trip_id, day_number)
            );
            CREATE TABLE IF NOT EXISTS api_keys (
              name            TEXT PRIMARY KEY,
              encrypted_value TEXT NOT NULL,
              hint            TEXT NOT NULL DEFAULT '',
              updated_at      TEXT DEFAULT (datetime('now'))
            );
          `);

          // Verify tables
          const tables = db.prepare(
            "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
          ).all().map(r => r.name);
          console.log('Tables:', tables.join(', '));
          for (const t of ['api_keys', 'days', 'trips']) {
            if (!tables.includes(t)) { console.error(`Missing table: ${t}`); process.exit(1); }
          }

          // Trips round-trip
          db.prepare('INSERT INTO trips (id, destination) VALUES (?,?)').run('ci-1','Paris');
          const trip = db.prepare("SELECT destination FROM trips WHERE id='ci-1'").get();
          if (trip.destination !== 'Paris') { console.error('Trips round-trip failed'); process.exit(1); }

          // API key encrypt → store → retrieve → decrypt round-trip
          const plain = 'sk-test-api-key-1234567890';
          const enc   = encrypt(plain);
          db.prepare(
            "INSERT INTO api_keys (name, encrypted_value, hint) VALUES (?,?,?)"
          ).run('GEMINI_API_KEY', enc, plain.slice(-4));

          const row = db.prepare("SELECT encrypted_value FROM api_keys WHERE name='GEMINI_API_KEY'").get();
          const decrypted = decrypt(row.encrypted_value);
          if (decrypted !== plain) {
            console.error(`Decrypt mismatch: got "${decrypted}", want "${plain}"`);
            process.exit(1);
          }

          db.close();
          fs.unlinkSync(DB_PATH);
          console.log('DB init + encryption round-trip check passed.');
          EOF

  # ─────────────────────────────────────────────
  # Security audit
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # npm audit reads package-lock.json only — no node_modules needed.
          # Supply all three lockfiles so the npm cache covers the whole monorepo.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Audit root dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true
