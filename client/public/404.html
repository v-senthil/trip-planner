<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trip Planner</title>
    <!--
      GitHub Pages SPA redirect.
      When a user navigates directly to a sub-route (e.g. /plan, /my-trips),
      GitHub Pages returns a 404. This page rewrites the path into a query
      string and redirects to index.html, which then restores the original URL.
      Based on: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // Take the current path + query, store it as a query parameter,
      // and redirect to the root so index.html can handle it.
      var pathSegmentsToKeep = 1; // keep /<repo-name>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
